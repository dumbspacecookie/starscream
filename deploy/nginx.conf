# Starscream production reverse proxy (nginx)
#
# Point upstream at the API (uvicorn). With docker-compose.prod.yml the API listens on
# host port 8000; adjust if you bind differently or run nginx in the same compose network
# (use `api:8000` instead of 127.0.0.1).

upstream starscream_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Security headers applied to all responses (including errors).
map $sent_http_content_type $csp_default {
    default "default-src 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name starscream.example;

    # Redirect HTTP to HTTPS once TLS certificates are in place:
    # return 301 https://$host$request_uri;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $csp_default always;

    client_max_body_size 100m;

    location / {
        proxy_pass http://starscream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

