<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — Starscream</title>
  <link rel="stylesheet" href="/static/site.css" />
</head>
<body>
  <nav class="site-nav">
    <a href="/explore" class="site-nav-brand">Star<span>scream</span></a>
    <div class="site-nav-links">
      <a href="/explore">Explore</a>
      <a href="/upload">Contribute</a>
      <a href="/mobile">Mobile</a>
      <div class="site-nav-dropdown">
        <button type="button" class="site-nav-dropdown-btn" aria-haspopup="true">Community ▾</button>
        <div class="site-nav-dropdown-menu" role="menu">
          <a href="/contributors-page" role="menuitem">Contributors</a>
          <a href="/leaderboard" class="active" role="menuitem">Leaderboard</a>
          <a href="/batch" role="menuitem">Batch upload</a>
        </div>
      </div>
      <a href="/stats">Stats</a>
    </div>
  </nav>

  <div class="site-wrap">
    <header class="page-header">
      <h1>Contributor <span>leaderboard</span></h1>
      <p>Top contributors ranked by sounds submitted to the open catalog.</p>
    </header>

    <div id="leaderboard">
      <div class="loading">Loading leaderboard…</div>
    </div>
  </div>

  <script>
    const leaderboardEl = document.getElementById("leaderboard");

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s ?? "";
      return d.innerHTML;
    }

    function normalizeRows(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.contributors)) return data.contributors;
      if (data && Array.isArray(data.items)) return data.items;
      return [];
    }

    async function load() {
      try {
        const res = await fetch("/v1/contributors/leaderboard");
        if (res.status === 404) {
          leaderboardEl.innerHTML = '<div class="empty">Leaderboard endpoint not available yet.</div>';
          return;
        }
        if (!res.ok) throw new Error(res.statusText);

        const data = await res.json();
        const rows = normalizeRows(data);

        if (!rows.length) {
          leaderboardEl.innerHTML = '<div class="empty">No contributors yet — <a href="/upload">submit the first sound</a>.</div>';
          return;
        }

        const sorted = [...rows].sort((a, b) => (b.sound_count ?? 0) - (a.sound_count ?? 0));

        leaderboardEl.innerHTML = `
          <div class="card">
            <h2>Top contributors</h2>
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Contributor</th>
                  <th>GitHub</th>
                  <th style="text-align:right">Sounds</th>
                </tr>
              </thead>
              <tbody>
                ${sorted.map((row, i) => `
                  <tr>
                    <td class="rank">${i + 1}</td>
                    <td>
                      <a href="/contributors-page">${esc(row.display_name) || "Anonymous"}</a>
                      ${row.id ? `<div class="meta" style="font-size:0.75rem;color:var(--muted);font-family:var(--mono)">${esc(String(row.id).slice(0, 8))}…</div>` : ""}
                    </td>
                    <td>${row.github_username ? esc(row.github_username) : "—"}</td>
                    <td class="count">${Number(row.sound_count ?? 0).toLocaleString()}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
          <p style="text-align:center;color:var(--muted);font-size:0.85rem;margin-top:1rem">
            <a href="/contributors-page">Register as a contributor</a> · <a href="/upload">Contribute a sound</a>
          </p>
        `;
      } catch (e) {
        leaderboardEl.innerHTML = `<div class="error">Failed to load leaderboard: ${esc(e.message)}</div>`;
      }
    }

    load();
  </script>
</body>
</html>
